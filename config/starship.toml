# =============================================================================
# MODULES
# =============================================================================

[os]
disabled = false
style = "bg:red fg:crust"

# Nerd Font OS symbols (uncomment if you have a Nerd Font installed)
[os.symbols]
Macos = "  "
# Windows = ""
# Ubuntu = "󰕈"
# SUSE = ""
# Raspbian = "󰐿"
# Mint = "󰣭"
# Macos = "󰀵"
# Manjaro = ""
# Linux = "󰌽"
# Gentoo = "󰣨"
# Fedora = "󰣛"
# Alpine = ""
# Amazon = ""
# Android = ""
# AOSC = ""
# Arch = "󰣇"
# Artix = "󰣇"
# CentOS = ""
# Debian = "󰣚"
# Redhat = "󱄛"
# RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

# Show success/error indicator (matches original PS1)
[status]
disabled = false
format = '[$symbol]($style)'
symbol = ''
# success_symbol = '💚 '
success_symbol = ''
not_executable_symbol = ' 💔 '
not_found_symbol = ' 💔 '
sigint_symbol = ' 💔 '
signal_symbol = ' 💔 '
style = 'fg:green bg:sapphire'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
# Your custom substitutions
'/cooksatlas' = '/ca'
'/agent-workspaces' = '/a-w'
'/workspaces' = '/w'
'/backend.' = '/b.'
'/frontend.' = '/f.'
'/fullstack.' = '/fs.'
'/Mobile Documents/com~apple~CloudDocs' = '/.icloud-drive'
'/iCloud~md~obsidian/Documents/Ebrain' = '/.ebrain-vault'
# Nerd Font directory icons (uncomment if you have a Nerd Font installed)
# "Documents" = "󰈙 "
# "Downloads" = " "
# "Music" = "󰝚 "
# "Pictures" = " "
# "Developer" = "󰲋 "

[git_branch]
# symbol = ""  # Nerd Font symbol
style = "bg:yellow"
format = '[[ $symbol$branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

# Random prompt emoji (set per-session in shell config)
[env_var.SHELL_EMOJI]
format = '$env_value '
default = '$ '

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

# =============================================================================
# LANGUAGE MODULES (shown when in relevant project directories)
# =============================================================================

[nodejs]
# symbol = ""
symbol = "⬢"
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
# symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
# symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
# symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
# symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
# symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
# symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
# symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
# symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
# symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
# symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

# =============================================================================
# TIME & DURATION
# =============================================================================

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[ $time ](fg:crust bg:lavender)]($style)'

[cmd_duration]
show_milliseconds = true
format = "[ ⏲ $duration ](fg:crust bg:sapphire)"
disabled = false
show_notifications = false

[line_break]
disabled = true

