# Starship prompt configuration
# Cross-shell prompt (zsh, fish, nushell)
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

# Color palette (Catppuccin Mocha)
palette = 'catppuccin_mocha'

# =============================================================================
# FORMAT VARIANTS - Uncomment ONE format section at a time to test
# =============================================================================

# -----------------------------------------------------------------------------
# VARIANT 1: Original simple format (left + right)
# -----------------------------------------------------------------------------
# format = """
# $status\
# $directory\
# ${env_var.SHELL_EMOJI}"""
# right_format = """$git_branch$git_status"""

# -----------------------------------------------------------------------------
# VARIANT 2: Full powerline (all on left, colored segments)
# -----------------------------------------------------------------------------
format = """
[](red)\
$os\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
[](fg:green bg:sapphire)\
$cmd_duration\
$status\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$line_break\
${env_var.SHELL_EMOJI}\
$character"""

# format = """
# [](red)\
# $os\
# [](bg:peach fg:red)\
# $directory\
# [](bg:yellow fg:peach)\
# $git_branch\
# $git_status\
# [](fg:yellow bg:green)\
# $c\
# $rust\
# $golang\
# $nodejs\
# $php\
# $java\
# $kotlin\
# $haskell\
# $python\
# [](fg:green bg:sapphire)\
# $cmd_duration\
# $status\
# [](fg:sapphire bg:lavender)\
# $time\
# [ ](fg:lavender)\
# $line_break\
# ${env_var.SHELL_EMOJI}\
# $character"""

# -----------------------------------------------------------------------------
# VARIANT 3: Hybrid powerline (simplified left + right_format)
# Left: os/user/status/directory, Right: git/languages/conda/time
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# VARIANT - Powerline Original.
# Left: os/user/status/directory, Right: git/languages/conda/time
# -----------------------------------------------------------------------------

